name: Testar API do Preview

on:
  push:
    branches:
      - preview/ra-erp-5.0
    paths:
      - .github/workflows/preview-api-check.yml

permissions:
  contents: read

jobs:
  verificar-api:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar acesso seguro ao Preview
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          python3 - <<'CHECK'
          import os
          import json
          import urllib.request
          import sys

          url = "https://ra-eletrica-automacao-git-preview-712e81-raopuba-5606s-projects.vercel.app/api/notifications/vapid-public-key"

          secret = os.environ.get("VERCEL_BYPASS")
          if not secret:
              sys.exit("ERRO: Credencial Vercel ausente no GitHub.")

          req = urllib.request.Request(
              url,
              headers={"x-vercel-protection-bypass": secret}
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  content_type = r.headers.get("Content-Type", "")
                  if "application/json" not in content_type:
                      sys.exit("ERRO: A API não retornou JSON.")
                  data = json.load(r)
                  if not data.get("publicKey"):
                      sys.exit("ERRO: Chave pública VAPID indisponível.")
                  print("SUCESSO: API do Preview acessível e VAPID disponível.")
          except Exception as e:
              print("FALHA:", type(e).__name__)
              sys.exit(1)
          CHECK

      - name: Diagnosticar autenticação Firebase
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_CRON_SECRET: ${{ secrets.PREVIEW_CRON_SECRET }}
        run: |
          python3 - <<'CHECK'
          import os
          import json
          import sys
          import urllib.request
          import urllib.error

          url = "https://ra-eletrica-automacao-git-preview-712e81-raopuba-5606s-projects.vercel.app/api/cron/health"

          bypass = os.environ.get("VERCEL_BYPASS")
          cron = os.environ.get("PREVIEW_CRON_SECRET")

          if not bypass or not cron:
              sys.exit("ERRO: Credencial ausente no GitHub Secrets.")

          req = urllib.request.Request(url, headers={
              "x-vercel-protection-bypass": bypass,
              "Authorization": "Bearer " + cron
          })

          try:
              with urllib.request.urlopen(req, timeout=25) as r:
                  status = r.status
                  data = json.load(r)
          except urllib.error.HTTPError as e:
              status = e.code
              try:
                  data = json.loads(e.read().decode())
              except Exception:
                  data = {}
          except Exception as e:
              print("Falha de conexão:", type(e).__name__)
              sys.exit(1)

          code = data.get("backend", "SEM_DIAGNOSTICO")
          print("HTTP:", status)
          print("Resultado Firebase:", code)

          if status != 200 or code != "firebase-admin" or data.get("firestore") != "connected":
              sys.exit(1)

          print("SUCESSO: Firebase Admin e Firestore acessíveis no Preview.")
          CHECK
